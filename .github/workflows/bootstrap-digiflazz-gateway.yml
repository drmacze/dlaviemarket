name: Bootstrap Digiflazz Gateway

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Fly.io app name
        required: true
        default: dlavie-digiflazz-drmacze
        type: string
      org_slug:
        description: Fly.io organization slug
        required: true
        default: personal
        type: string

permissions:
  contents: read

concurrency:
  group: digiflazz-gateway-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      DLAVIE_GATEWAY_SECRET: ${{ secrets.DLAVIE_GATEWAY_SECRET }}
      APP_NAME: ${{ inputs.app_name }}
      ORG_SLUG: ${{ inputs.org_slug }}
      REGION: sin
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN" || { echo "Missing GitHub secret FLY_API_TOKEN"; exit 1; }
          test -n "$DLAVIE_GATEWAY_SECRET" || { echo "Missing GitHub secret DLAVIE_GATEWAY_SECRET"; exit 1; }

      - name: Create Fly app if needed
        shell: bash
        run: |
          set -euo pipefail
          if flyctl status -a "$APP_NAME" >/dev/null 2>&1; then
            echo "Fly app already exists: $APP_NAME"
          else
            flyctl apps create "$APP_NAME" --org "$ORG_SLUG" --yes
          fi

      - name: Store gateway secret on Fly
        shell: bash
        run: |
          set -euo pipefail
          flyctl secrets set DLAVIE_GATEWAY_SECRET="$DLAVIE_GATEWAY_SECRET" -a "$APP_NAME"

      - name: Deploy gateway
        shell: bash
        run: |
          set -euo pipefail
          cd gateway/digiflazz-static-egress
          flyctl deploy --config fly.toml --app "$APP_NAME" --remote-only

      - name: Allocate static egress IP once
        shell: bash
        run: |
          set -euo pipefail
          IPS_JSON="$(flyctl ips list -a "$APP_NAME" --json)"
          if printf '%s' "$IPS_JSON" | grep -qi 'egress'; then
            echo "Static egress IP already exists; no new IP allocated."
          else
            flyctl ips allocate-egress -a "$APP_NAME" -r "$REGION" --yes
          fi

      - name: Verify gateway health
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${APP_NAME}.fly.dev"
          for i in $(seq 1 12); do
            if curl -fsS "$URL/health"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "Gateway health check failed after retries."
          exit 1

      - name: Print setup result
        shell: bash
        run: |
          set -euo pipefail
          echo "## Digiflazz Gateway Ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Gateway URL:** https://${APP_NAME}.fly.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Fly IP allocation:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          flyctl ips list -a "$APP_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Whitelist the IPv4 marked as egress/static for region ${REGION} in Digiflazz, then save the Gateway URL above in DLavie Admin and press Test gateway." >> "$GITHUB_STEP_SUMMARY"
